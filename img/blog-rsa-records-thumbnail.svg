<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RSA factoring records advancing</title>
  <desc id="desc">Three glowing milestones rise from RSA-250 through RSA-260 to RSA-896.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#120d0f"/>
      <stop offset="1" stop-color="#321923"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#74404b"/>
      <stop offset=".5" stop-color="#c86a78"/>
      <stop offset="1" stop-color="#f0a8b3"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#d9909b" stop-opacity=".24"/>
      <stop offset="1" stop-color="#d9909b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#d9909b" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <g fill="none" stroke="#d9909b" stroke-opacity=".13">
    <circle cx="985" cy="190" r="240"/>
    <circle cx="985" cy="190" r="180"/>
    <circle cx="985" cy="190" r="120"/>
    <circle cx="110" cy="740" r="300"/>
    <circle cx="110" cy="740" r="240"/>
  </g>
  <circle cx="965" cy="260" r="245" fill="url(#halo)"/>
  <path d="M125 465H250L600 365L950 255H1075" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#120d0f" stroke-width="9">
    <circle cx="250" cy="465" r="32" stroke="#9c6973"/>
    <circle cx="600" cy="365" r="42" stroke="#c86a78"/>
    <circle cx="950" cy="255" r="54" stroke="#f0a8b3"/>
  </g>
  <g fill="#f7f2f3" font-family="system-ui, sans-serif" font-size="42" font-weight="650" text-anchor="middle">
    <text x="250" y="555">RSA-250</text>
    <text x="600" y="465">RSA-260</text>
    <text x="950" y="375">RSA-896</text>
  </g>
</svg>
