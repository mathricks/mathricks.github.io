    <line x1="1120" y1="120" x2="1120" y2="500" class="grid"/>
    <text x="1120" y="530" class="tick" text-anchor="middle">5×</text>
    <line x1="120" y1="500" x2="1120" y2="500" class="grid"/>
    <text x="104" y="506" class="tick" text-anchor="end">0%</text>
    <line x1="120" y1="405" x2="1120" y2="405" class="grid"/>
    <text x="104" y="411" class="tick" text-anchor="end">25%</text>
    <line x1="120" y1="310" x2="1120" y2="310" class="grid"/>
    <text x="104" y="316" class="tick" text-anchor="end">50%</text>
    <line x1="120" y1="215" x2="1120" y2="215" class="grid"/>
    <text x="104" y="221" class="tick" text-anchor="end">75%</text>
    <line x1="120" y1="120" x2="1120" y2="120" class="grid"/>
    <text x="104" y="126" class="tick" text-anchor="end">100%</text>
  </g>

