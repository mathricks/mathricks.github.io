<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
  aria-label="Chart of the probability of having found a target key against the number of random draws, measured in multiples of the key-space. The curve one minus e to the minus c passes through 63.2 percent at one multiple, 86.5 percent at two and 95.0 percent at three.">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4C236" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#F4C236" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .bg    { fill: #0e1111; }
      .grid  { stroke: #ffffff; stroke-opacity: 0.16; stroke-width: 1; }
      .axis  { stroke: #ffffff; stroke-opacity: 0.45; stroke-width: 2; }
      .curve { fill: none; stroke: #F4C236; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .lead  { stroke: #ffffff; stroke-width: 2.5; stroke-dasharray: 7 7; }
      .faint { stroke: #9aa6b2; stroke-opacity: 0.5; stroke-width: 2; }
      .dot   { fill: #ffffff; }
      .faint-dot { fill: #9aa6b2; }
      .tick  { fill: #9aa6b2; font: 500 21px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .call  { fill: #ffffff; font: 700 30px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .call.small { fill: #9aa6b2; font-size: 23px; font-weight: 600; }
      .title { fill: #ffffff; font: 700 40px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .sub   { fill: #9aa6b2; font: 400 24px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .axlab { fill: #9aa6b2; font: 600 21px system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" rx="24" class="bg"/>
  <text x="120" y="62" class="title">Random draws never finish the job</text>
  <text x="120" y="97" class="sub">Chance of having hit the key after n random guesses, n measured in key-spaces</text>

